plugins {
    id 'com.android.application'
}

configurations { natives }

android {
    namespace 'ai.nauru.countryside'
    compileSdk 36

    defaultConfig {
        applicationId 'ai.nauru.countryside'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main {
        assets.srcDirs = ['assets']
        jniLibs.srcDir layout.buildDirectory.dir('generated/jniLibs')
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}

ext.gdxVersion = '1.13.1'

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-bullet:$gdxVersion"

    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-x86_64"

    testImplementation 'junit:junit:4.13.2'
}

tasks.register('copyAndroidNatives', Copy) {
    // Some libGDX native archives store their .so files at archive root. Preserve the
    // classifier ABI directory explicitly so same-named libraries from different ABIs
    // cannot collide when the Copy task assembles jniLibs.
    configurations.natives.resolvedConfiguration.resolvedArtifacts.each { artifact ->
        def marker = 'natives-'
        def classifier = artifact.classifier ?: ''
        def markerIndex = classifier.lastIndexOf(marker)
        if (markerIndex < 0) throw new GradleException("Native dependency has no ABI classifier: ${artifact.moduleVersion.id}")
        def abi = classifier.substring(markerIndex + marker.length())
        from(zipTree(artifact.file)) {
            include '**/*.so'
            eachFile { details -> details.path = "${abi}/${details.name}" }
        }
    }
    into layout.buildDirectory.dir('generated/jniLibs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    includeEmptyDirs = false
}

tasks.named('preBuild').configure { dependsOn 'copyAndroidNatives' }
