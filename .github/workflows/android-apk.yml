name: Nauru Countryside Android APK

on:
  push:
    branches: [arena/7a3bc4c5-temporary3]
    paths-ignore: ["artifacts/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nauru-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: "**/*.gradle*"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Test geodata tooling
        run: python -m unittest discover -s tools -p 'test*.py' -v

      - name: Fetch and checksum open Nauru source data
        run: python tools/fetch_sources.py

      - name: Compile real OSM and SRTM into offline world package
        run: |
          python - <<'PY'
          import pathlib, sys, traceback
          sys.path.insert(0, "tools")
          from build_geodata import build
          try:
              audit = build(pathlib.Path("data/geodata/downloads/nauru_overpass.json"),
                            pathlib.Path("data/geodata/downloads/S01E166.hgt.gz"),
                            pathlib.Path("android/assets/compiled/world.bin"),
                            pathlib.Path("android/assets/compiled/manifest.json"))
              print(audit)
          except Exception as error:
              traceback.print_exc()
              print(f"::error title=World data compiler::{type(error).__name__}: {error}")
              raise
          PY

      - name: Package geodata provenance and license notices in the offline app
        run: |
          mkdir -p android/assets/licenses
          cp data/geodata/downloads/source-manifest.json android/assets/compiled/source-manifest.json
          cp ASSET_LICENSES.md android/assets/licenses/ASSET_LICENSES.txt
          cp DATA_SOURCES.md android/assets/licenses/DATA_SOURCES.txt

      - name: Run JVM tests and build installable debug APK
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain :core:test :android:testDebugUnitTest :android:assembleDebug > "$RUNNER_TEMP/gradle-build.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/gradle-build.log"
          if [ "$status" -ne 0 ]; then
            python - "$RUNNER_TEMP/gradle-build.log" <<'PY'
          import pathlib, re, sys, xml.etree.ElementTree as ET
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          interesting = [line.strip() for line in log if re.search(
              r"(^FAILURE:|What went wrong:|Execution failed for task|^> Task .*FAILED|error:|There were failing tests|Caused by:|Could not |Cannot |No such file|ZipException)",
              line)]
          for line in interesting[-30:]:
              safe = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Gradle build diagnostic::{safe[:900]}")
          if "* What went wrong:" in log:
              start = len(log) - 1 - log[::-1].index("* What went wrong:")
              for line in log[start:start + 24]:
                  safe = line.strip().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  if safe:
                      print(f"::notice title=Gradle failure details::{safe[:900]}")
          for root in (pathlib.Path("core/build/test-results/test"),
                       pathlib.Path("android/build/test-results/testDebugUnitTest")):
              for report in root.glob("TEST-*.xml"):
                  try:
                      suite = ET.parse(report).getroot()
                  except ET.ParseError:
                      continue
                  for case in suite.iter("testcase"):
                      failure = case.find("failure")
                      if failure is None:
                          continue
                      message = " ".join((failure.get("message") or "").split())
                      title = f"{case.get('classname')}.{case.get('name')}"
                      print(f"::error title=JUnit test failure::{title}: {message[:900]}")
                      trace = failure.text or ""
                      for line in [line.strip() for line in trace.splitlines()
                                   if "AssertionError" in line or "expected:" in line
                                   or line.strip().startswith("at ")][:8]:
                          safe = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print(f"::notice title=JUnit failure trace::{safe[:900]}")
          PY
          fi
          exit "$status"

      - name: Validate APK, package metadata, native libraries, and world payload
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          mkdir -p artifacts
          cp android/build/outputs/apk/debug/android-debug.apk artifacts/NauruTheCountryside-v0.2.0-debug.apk
          "$APKSIGNER" verify --verbose artifacts/NauruTheCountryside-v0.2.0-debug.apk
          python tools/validate_apk.py \
            --apk artifacts/NauruTheCountryside-v0.2.0-debug.apk \
            --aapt "$AAPT" \
            --out-dir artifacts

      - name: Enable KVM access for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch the APK on an Android 8 emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 26
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -eux
            APK="artifacts/NauruTheCountryside-v0.2.0-debug.apk"
            adb logcat -c
            adb install -r "$APK"
            adb shell am force-stop ai.nauru.countryside
            adb shell am start -W -n ai.nauru.countryside/.AndroidLauncher
            sleep 20
            adb logcat -d -v brief > "$RUNNER_TEMP/countryside-logcat.txt"
            if grep -E "FATAL EXCEPTION|Fatal signal|Could not load compiled/world.bin|WORLD STARTUP FAILED" "$RUNNER_TEMP/countryside-logcat.txt"; then
              echo "Android emulator reported a launch or offline-world failure."
              tail -n 200 "$RUNNER_TEMP/countryside-logcat.txt"
              exit 1
            fi
            if ! grep -q "Loaded offline NCRW world" "$RUNNER_TEMP/countryside-logcat.txt"; then
              echo "The activity did not report loading the packaged offline world."
              tail -n 200 "$RUNNER_TEMP/countryside-logcat.txt"
              exit 1
            fi
            adb shell pidof ai.nauru.countryside
            mkdir -p artifacts/emulator
            adb exec-out screencap -p > artifacts/emulator/startup-api26.png
            test -s artifacts/emulator/startup-api26.png
            echo "Android 8 launch passed; screenshot bytes=$(stat -c '%s' artifacts/emulator/startup-api26.png)"

      - name: Upload APK, emulator screenshot, and provenance as workflow artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: NauruTheCountryside-debug-${{ github.run_number }}
          path: |
            artifacts/NauruTheCountryside-v0.2.0-debug.apk
            artifacts/emulator/startup-api26.png
            artifacts/NauruTheCountryside-v0.2.0-debug.apk.sha256
            artifacts/build-metadata.json
            android/assets/compiled/manifest.json
            android/assets/compiled/source-manifest.json
            android/assets/licenses/ASSET_LICENSES.txt
            android/assets/licenses/DATA_SOURCES.txt
            DATA_SOURCES.md
            ASSET_LICENSES.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish a prerelease and downloadable APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          TAG="countryside-${RUN_ID}-${RUN_ATTEMPT}"
          gh release create "$TAG" \
            artifacts/NauruTheCountryside-v0.2.0-debug.apk \
            artifacts/NauruTheCountryside-v0.2.0-debug.apk.sha256 \
            artifacts/build-metadata.json \
            android/assets/compiled/manifest.json \
            android/assets/compiled/source-manifest.json \
            ASSET_LICENSES.md \
            DATA_SOURCES.md \
            --repo "$REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "Nauru: The Countryside 0.2.0 — build ${RUN_ID}" \
            --notes "Installable Android debug APK. CI compiled the offline world from OpenStreetMap and SRTM source data, ran JVM/geodata tests, validated APK metadata/native ABIs/checksums, and installed/launched the build in an Android 8 API 26 emulator with the packaged offline world loaded. No physical-device test is claimed." \
            --prerelease

      - name: Smoke-test unauthenticated public APK and checksum downloads
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          TAG="countryside-${RUN_ID}-${RUN_ATTEMPT}"
          FILE="NauruTheCountryside-v0.2.0-debug.apk"
          URL="https://github.com/${REPOSITORY}/releases/download/${TAG}"
          mkdir -p "$RUNNER_TEMP/release-smoke-test"
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 \
            "$URL/$FILE" --output "$RUNNER_TEMP/release-smoke-test/$FILE"
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 \
            "$URL/$FILE.sha256" --output "$RUNNER_TEMP/release-smoke-test/$FILE.sha256"
          cmp "$RUNNER_TEMP/release-smoke-test/$FILE" "artifacts/$FILE"
          (cd "$RUNNER_TEMP/release-smoke-test" && sha256sum --check "$FILE.sha256")
          echo "::notice title=Download link verified::Unauthenticated HTTPS downloads of the published APK and checksum succeeded; bytes=$(stat -c '%s' "$RUNNER_TEMP/release-smoke-test/$FILE"); sha256=$(sha256sum "$RUNNER_TEMP/release-smoke-test/$FILE" | cut -d' ' -f1)"
